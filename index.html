<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bonkitos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffcc00; --cyan: #00e5ff; --red: #ff3333;
            --bg: #0e0e14; --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09);
            --font-title: 'Boogaloo', cursive; --font-body: 'Nunito', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { background: var(--bg); color: white; font-family: var(--font-body); width: 100%; height: 100%; overflow: hidden; position: fixed; }
        .screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        #menuScreen { display: flex; background: radial-gradient(ellipse at 20% 50%, #1a1040 0%, #0e0e14 55%, #0a0a10 100%); padding: 12px; overflow: hidden; }
        #menuScreen::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.4) 0%, transparent 100%), radial-gradient(1px 1px at 30% 40%, rgba(255,204,0,0.3) 0%, transparent 100%), radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.3) 0%, transparent 100%), radial-gradient(1px 1px at 75% 60%, rgba(0,229,255,0.3) 0%, transparent 100%), radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,0.25) 0%, transparent 100%), radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,0.2) 0%, transparent 100%), radial-gradient(1px 1px at 85% 80%, rgba(255,204,0,0.2) 0%, transparent 100%), radial-gradient(2px 2px at 45% 70%, rgba(255,255,255,0.15) 0%, transparent 100%), radial-gradient(1px 1px at 62% 88%, rgba(0,229,255,0.2) 0%, transparent 100%); pointer-events: none; z-index: 0; }
        .menu-wrapper { position: relative; z-index: 1; width: 100%; max-width: 980px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; animation: logoFloat 3s ease-in-out infinite; }
        @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .logo-title { font-family: var(--font-title); font-size: 52px; letter-spacing: 3px; line-height: 1; background: linear-gradient(135deg, #fff176 0%, #ffcc00 35%, #ff9800 65%, #ff6f00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 18px rgba(255,180,0,0.55)); }
        .logo-sub { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; color: rgba(255,255,255,0.35); }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px; width: 100%; }
        .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 9px; backdrop-filter: blur(6px); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 18px 18px 0 0; }
        .card-blue::before { background: linear-gradient(90deg, transparent, var(--cyan), transparent); }
        .card-gold::before { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .card-shop::before { background: linear-gradient(90deg, transparent, #ff9800, transparent); }
        .card-label { font-size: 11px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 2px; }
        .card-label.blue { color: var(--cyan); } .card-label.gold { color: var(--gold); } .card-label.orange { color: #ff9800; }
        .stat-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; }
        .stat-up-btn { background: var(--gold); color: #111; border: none; font-weight: 800; font-size: 14px; padding: 1px 11px; border-radius: 8px; cursor: pointer; transition: transform 0.1s; font-family: var(--font-body); }
        .stat-up-btn:active { transform: scale(0.9); }
        .stat-up-btn:disabled { background: #333; color: #555; cursor: not-allowed; }
        .points-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,204,0,0.12); border: 1px solid rgba(255,204,0,0.3); border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 700; color: var(--gold); align-self: flex-start; }
        .xp-area { margin-top: auto; }
        .xp-bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.06); border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }
        .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #00e5ff, #0084ff); border-radius: 5px; transition: width 0.4s ease; width: 0%; }
        .xp-text { font-size: 10px; text-align: center; color: rgba(0,229,255,0.7); margin-top: 3px; font-weight: 700; letter-spacing: 0.5px; }
        .reset-btn { background: rgba(255,51,51,0.15); color: #ff6666; border: 1px solid rgba(255,51,51,0.3); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 8px; cursor: pointer; letter-spacing: 1px; font-family: var(--font-body); }
        .setting-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.75); }
        select { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.15); padding: 5px 8px; border-radius: 9px; font-size: 12px; font-family: var(--font-body); font-weight: 600; outline: none; max-width: 155px; }
        select option { background: #1a1a28; }
        .play-btn { width: 100%; padding: 13px; font-size: 20px; font-weight: 800; font-family: var(--font-title); letter-spacing: 3px; background: linear-gradient(135deg, #4CAF50, #2e7d32); color: white; border: none; border-radius: 16px; box-shadow: 0 6px 20px rgba(76,175,80,0.35), inset 0 1px 0 rgba(255,255,255,0.15); cursor: pointer; transition: transform 0.1s; position: relative; overflow: hidden; }
        .play-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 60%); border-radius: 16px; pointer-events: none; }
        .play-btn:active { transform: scale(0.98); }
        .shop-scroll { overflow-y: auto; flex: 1; padding-right: 4px; }
        .shop-scroll::-webkit-scrollbar { width: 4px; }
        .shop-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
        .shop-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .shop-item span { font-size: 8px; color: rgba(255,255,255,0.45); font-weight: 700; }
        .color-circle { width: 28px; height: 28px; border-radius: 50%; padding: 0; cursor: pointer; border: 2px solid rgba(0,0,0,0.3); transition: transform 0.15s, box-shadow 0.15s; }
        .color-circle.selected { border: 2.5px solid var(--gold); transform: scale(1.15); box-shadow: 0 0 8px rgba(255,204,0,0.5); }
        .color-circle.locked { filter: brightness(0.2) grayscale(0.8); }
        .preview-gold { background: radial-gradient(circle, #ffe066, #d4af37); box-shadow: 0 0 5px #ffd700; }
        .preview-emerald { background: radial-gradient(circle, #66ff99, #00a86b); box-shadow: 0 0 5px #00ff7f; }
        .preview-diamond { background: radial-gradient(circle, #e6ffff, #4aa3df); box-shadow: 0 0 5px #00e5ff; }
        .preview-rgb { background: linear-gradient(45deg, red, orange, yellow, green, blue, purple); }
        .preview-bosshc { background: radial-gradient(circle, #ff4d4d, #440000); box-shadow: 0 0 7px #ff0000; border-radius: 4px !important; }
        .shop-btn { font-size: 8px; padding: 2px 3px; background: rgba(255,152,0,0.85); border: none; font-weight: 800; border-radius: 5px; width: 100%; color: #fff; cursor: pointer; font-family: var(--font-body); }
        .top-hud { position: absolute; top: 12px; right: 16px; display: flex; align-items: center; gap: 10px; z-index: 20; }
        .hud-card { background: rgba(15,15,25,0.85); border: 1.5px solid var(--gold); padding: 4px 13px; border-radius: 20px; font-weight: 800; font-size: 14px; color: var(--gold); display: flex; align-items: center; gap: 5px; backdrop-filter: blur(8px); font-family: var(--font-body); }
        .level-hud { border-color: var(--cyan); color: var(--cyan); }
        #gameScreen { background-color: #1c1c22; }
        #canvasWrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: filter 0.3s; }
        canvas { width: 100%; height: 100%; display: block; }
        #pauseBtn { position: absolute; top: 14px; left: 22px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 7px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; z-index: 7; cursor: pointer; font-family: var(--font-body); }
        .overlay-layer { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 8; pointer-events: none; }
        #countdownText { font-size: 80px; font-weight: bold; color: var(--gold); font-family: var(--font-title); text-shadow: 0 4px 20px rgba(255,200,0,0.6); }
        .result-box { background: rgba(10,10,20,0.9); border: 1.5px solid rgba(255,255,255,0.1); padding: 26px 42px; border-radius: 24px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.7); backdrop-filter: blur(14px); pointer-events: auto; display: flex; flex-direction: column; gap: 12px; min-width: 280px; }
        .result-title { font-size: 22px; color: var(--gold); font-weight: 800; }
        .result-score { font-size: 26px; font-weight: 800; letter-spacing: 2px; font-family: var(--font-title); }
        .result-xp { font-size: 14px; color: var(--cyan); font-weight: 700; }
        .menu-box-btn { width: 100%; padding: 10px; font-weight: 700; cursor: pointer; border: none; border-radius: 10px; font-family: var(--font-body); font-size: 14px; }
        .btn-resume { background: #4CAF50; color: white; } .btn-restart { background: #2196F3; color: white; } .btn-exit { background: #f44336; color: white; } .btn-toggle { background: #795548; color: white; }
        .hud-container { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        #joystickContainer { position: absolute; bottom: 25px; left: 30px; width: 90px; height: 90px; background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.18); border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; }
        #joystickKnob { width: 38px; height: 38px; background: rgba(255,255,255,0.9); border-radius: 50%; box-shadow: 0 3px 10px rgba(0,0,0,0.4); }
        #heavyContainer { position: absolute; bottom: 25px; right: 30px; display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: auto; }
        #cooldownBarContainer { width: 80px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        #cooldownBar { width: 100%; height: 100%; background: #00E676; }
        #heavyBtn { width: 78px; height: 78px; background: linear-gradient(135deg, #ff9800, #e65100); color: white; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; font-weight: 800; font-size: 13px; box-shadow: 0 5px 15px rgba(230,81,0,0.4); touch-action: none; font-family: var(--font-body); }
    </style>
</head>
<body>
    <div class="top-hud">
        <div class="hud-card level-hud">🌟 Nv. <span id="lvlLabel">1</span></div>
        <div class="hud-card">🪙 <span id="coinCount">0</span></div>
    </div>

    <div id="menuScreen" class="screen">
        <div class="menu-wrapper">
            <div class="logo-wrap">
                <div class="logo-title">Bonkitos</div>
                <div class="logo-sub">Arena</div>
            </div>
            <div class="menu-grid">
                <div class="card card-blue">
                    <div class="card-label blue">⚔ Status</div>
                    <div class="points-badge">✨ <span id="statPointsLabel">0</span> pts disponíveis</div>
                    <div class="stat-row"><div>💪 Força <span id="statStrengthLabel" style="color:#ff6b6b;font-weight:800;">1</span><span style="color:rgba(255,255,255,0.3)">/3</span></div><button class="stat-up-btn" id="btnUpStrength" onclick="upgradeStat('strength')">+</button></div>
                    <div class="stat-row"><div>🏋️ Peso <span id="statWeightLabel" style="color:#a78bfa;font-weight:800;">1</span><span style="color:rgba(255,255,255,0.3)">/3</span></div><button class="stat-up-btn" id="btnUpWeight" onclick="upgradeStat('weight')">+</button></div>
                    <div class="xp-area"><div class="xp-bar-bg"><div id="xpBarFill" class="xp-bar-fill"></div></div><div class="xp-text" id="xpText">0 / 1000 XP — Nv. 1</div></div>
                    <button class="reset-btn" onclick="triggerResetData()">⚠ RESET TOTAL</button>
                </div>
                <div class="card card-gold">
                    <div class="card-label gold">🎮 Partida</div>
                    <div class="setting-row"><span>Mapa</span><select id="mapSelect"><option value="classic">Clássico Largo</option><option value="small">Plataforma Curta</option><option value="double">Duplas</option></select></div>
                    <div class="setting-row"><span>Rounds</span><select id="roundSelect"><option value="3">3 Rounds</option><option value="5">5 Rounds</option><option value="7">7 Rounds</option></select></div>
                    <div class="setting-row"><span>Dificuldade</span><select id="difficultySelect"><option value="easy">😊 Fácil</option><option value="normal" selected>⚔ Normal</option><option value="hard">🔥 Difícil</option><option value="hardcore" style="color:#ff6b6b;">💀 HARDCORE</option></select></div>
                    <div style="margin-top:auto;"></div>
                </div>
                <div class="card card-shop">
                    <div class="card-label orange">🎨 Skins</div>
                    <div class="shop-scroll">
                        <div class="shop-grid">
                            <div class="shop-item"><button class="color-circle selected" id="btn-#007bff" style="background:#007bff;" onclick="buyOrSelectColor('#007bff',0)"></button><span>Azul</span></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#4CAF50" style="background:#4CAF50;" onclick="buyOrSelectColor('#4CAF50',5)"></button><button class="shop-btn" id="buy-#4CAF50" onclick="buyOrSelectColor('#4CAF50',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#9c27b0" style="background:#9c27b0;" onclick="buyOrSelectColor('#9c27b0',5)"></button><button class="shop-btn" id="buy-#9c27b0" onclick="buyOrSelectColor('#9c27b0',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#e91e63" style="background:#e91e63;" onclick="buyOrSelectColor('#e91e63',5)"></button><button class="shop-btn" id="buy-#e91e63" onclick="buyOrSelectColor('#e91e63',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#ff9800" style="background:#ff9800;" onclick="buyOrSelectColor('#ff9800',5)"></button><button class="shop-btn" id="buy-#ff9800" onclick="buyOrSelectColor('#ff9800',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#ffeb3b" style="background:#ffeb3b;" onclick="buyOrSelectColor('#ffeb3b',5)"></button><button class="shop-btn" id="buy-#ffeb3b" onclick="buyOrSelectColor('#ffeb3b',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#ffffff" style="background:#ffffff;" onclick="buyOrSelectColor('#ffffff',5)"></button><button class="shop-btn" id="buy-#ffffff" onclick="buyOrSelectColor('#ffffff',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#111111" style="background:#111111;" onclick="buyOrSelectColor('#111111',5)"></button><button class="shop-btn" id="buy-#111111" onclick="buyOrSelectColor('#111111',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#795548" style="background:#795548;" onclick="buyOrSelectColor('#795548',5)"></button><button class="shop-btn" id="buy-#795548" onclick="buyOrSelectColor('#795548',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#00bcd4" style="background:#00bcd4;" onclick="buyOrSelectColor('#00bcd4',5)"></button><button class="shop-btn" id="buy-#00bcd4" onclick="buyOrSelectColor('#00bcd4',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked" id="btn-#8bc34a" style="background:#8bc34a;" onclick="buyOrSelectColor('#8bc34a',5)"></button><button class="shop-btn" id="buy-#8bc34a" onclick="buyOrSelectColor('#8bc34a',5)">$5</button></div>
                            <div class="shop-item"><button class="color-circle locked preview-gold" id="btn-gold" onclick="buyOrSelectColor('gold',25)"></button><button class="shop-btn" id="buy-gold" style="background:#b8860b;" onclick="buyOrSelectColor('gold',25)">$25</button></div>
                            <div class="shop-item"><button class="color-circle locked preview-emerald" id="btn-emerald" onclick="buyOrSelectColor('emerald',50)"></button><button class="shop-btn" id="buy-emerald" style="background:#00695c;" onclick="buyOrSelectColor('emerald',50)">$50</button></div>
                            <div class="shop-item"><button class="color-circle locked preview-diamond" id="btn-diamond" onclick="buyOrSelectColor('diamond',100)"></button><button class="shop-btn" id="buy-diamond" style="background:#1565c0;" onclick="buyOrSelectColor('diamond',100)">$100</button></div>
                            <div class="shop-item"><button class="color-circle locked preview-rgb" id="btn-rgb" onclick="buyOrSelectColor('rgb',0)"></button><button class="shop-btn" id="buy-rgb" style="background:#6a1b9a;font-size:7px;" onclick="buyOrSelectColor('rgb',0)">ALL</button></div>
                            <div class="shop-item"><button class="color-circle locked preview-bosshc" id="btn-bosshc" onclick="buyOrSelectColor('bosshc',0)"></button><button class="shop-btn" id="buy-bosshc" style="background:#7f0000;font-size:7px;" onclick="buyOrSelectColor('bosshc',0)">🔒HC</button></div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="play-btn" onclick="startGame()">▶ JOGAR</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <button id="pauseBtn" onclick="togglePause()">⏸ PAUSE</button>
        <div id="canvasWrapper"><canvas id="gameCanvas"></canvas></div>
        <div id="countdownOverlay" class="overlay-layer"><div id="countdownText"></div></div>
        <div id="resultOverlay" class="overlay-layer">
            <div class="result-box">
                <div id="resultTitle" class="result-title">Fim do Round!</div>
                <div id="resultScore" class="result-score">VOCÊ 0 — 0 NPC</div>
                <div id="resultXp" class="result-xp">+0 XP</div>
                <div id="pauseButtons" style="display:none;flex-direction:column;gap:8px;width:100%;">
                    <button class="menu-box-btn btn-resume" onclick="togglePause()">▶ Continuar</button>
                    <button class="menu-box-btn btn-restart" onclick="restartMatch()">↺ Reiniciar Match</button>
                    <button class="menu-box-btn btn-toggle" id="shakeToggleBtn" onclick="toggleShake()">📳 Tremor: LIGADO</button>
                    <button class="menu-box-btn btn-exit" onclick="exitToMenu()">✕ Sair para o Menu</button>
                </div>
            </div>
        </div>
        <div class="hud-container">
            <div id="joystickContainer"><div id="joystickKnob"></div></div>
            <div id="heavyContainer"><div id="cooldownBarContainer"><div id="cooldownBar"></div></div><button id="heavyBtn">PESO</button></div>
        </div>
    </div>

    <script>
        const menuScreen=document.getElementById("menuScreen"),gameScreen=document.getElementById("gameScreen"),canvasWrapper=document.getElementById("canvasWrapper"),canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"),cooldownBar=document.getElementById("cooldownBar"),coinCountLabel=document.getElementById("coinCount"),lvlLabel=document.getElementById("lvlLabel"),countdownOverlay=document.getElementById("countdownOverlay"),countdownText=document.getElementById("countdownText"),resultOverlay=document.getElementById("resultOverlay"),resultTitle=document.getElementById("resultTitle"),resultScore=document.getElementById("resultScore"),resultXp=document.getElementById("resultXp"),pauseButtons=document.getElementById("pauseButtons");
        let level=1,currentXp=0,statPoints=0,statStrength=1,statWeight=1;
        const maxLevel=6,maxStatValue=3;
        function getXpNeeded(l){return[0,1000,5000,10000,50000,100000][l]||Infinity;}
        let coins=0,unlockedColors=["#007bff"],selectedColor="#007bff";
        const allBuyableColors=["#4CAF50","#9c27b0","#e91e63","#ff9800","#ffeb3b","#ffffff","#111111","#795548","#00bcd4","#8bc34a","gold","emerald","diamond"];
        let maxRounds=3,currentMapType="classic",currentDifficulty="normal",scorePlayer=0,scoreNPC=0,totalRoundsPlayed=0,gameActive=false,isPaused=false,allowScreenShake=true;
        const gravity=0.28,friction=0.92,bounce=0.35;
        let shakeTime=0,shakeIntensity=0,rgbHue=0,platforms=[];
        let player={x:0,y:0,vx:0,vy:0,radius:18,color:"#007bff",speed:0.42,mass:1,onGround:false,wasOnGround:false,isHeavy:false};
        let npc={x:0,y:0,vx:0,vy:0,radius:18,color:"#dc3545",speed:0.29,mass:1,baseMass:1,isHeavy:false,heavyTimer:0,onGround:false,wasOnGround:false};
        let particles=[],heavyEnergy=100,isRecharging=false,bosshcVisualSquares=[];
        const joystick=document.getElementById("joystickContainer"),knob=document.getElementById("joystickKnob"),heavyBtn=document.getElementById("heavyBtn");
        let joystickX=0,joystickY=0,joystickTouchId=null;
        let keys={left:false,right:false,up:false,down:false,heavy:false};
        document.addEventListener("keydown",e=>{if(e.code==="KeyA")keys.left=true;if(e.code==="KeyD")keys.right=true;if(e.code==="KeyW")keys.up=true;if(e.code==="KeyS")keys.down=true;if(e.code==="Space"){e.preventDefault();keys.heavy=true;}});
        document.addEventListener("keyup",e=>{if(e.code==="KeyA")keys.left=false;if(e.code==="KeyD")keys.right=false;if(e.code==="KeyW")keys.up=false;if(e.code==="KeyS")keys.down=false;if(e.code==="Space"){keys.heavy=false;player.isHeavy=false;}});

        function updateRpgInterface(){
            lvlLabel.innerText=level;
            document.getElementById("statPointsLabel").innerText=statPoints;
            document.getElementById("statStrengthLabel").innerText=statStrength;
            document.getElementById("statWeightLabel").innerText=statWeight;
            let req=getXpNeeded(level);
            if(level>=maxLevel){document.getElementById("xpBarFill").style.width="100%";document.getElementById("xpText").innerText="NÍVEL MÁXIMO!";}
            else{document.getElementById("xpBarFill").style.width=(currentXp/req*100)+"%";document.getElementById("xpText").innerText=`${currentXp} / ${req} XP — Nv. ${level}`;}

                else if(selectedColor==="rgb"){let c=`hsl(${rgbHue},100%,60%)`;ctx.save();ctx.shadowBlur=20;ctx.shadowColor=c;ctx.translate(player.x,player.y);ctx.rotate(Date.now()*0.003);ctx.strokeStyle=c;ctx.lineWidth=4;for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,player.radius*2.3);ctx.stroke();}ctx.restore();ctx.fillStyle=c;ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ffffff";ctx.lineWidth=2;ctx.stroke();}
                else if(selectedColor==="emerald"){ctx.shadowBlur=10;ctx.shadowColor="#00ff7f";ctx.fillStyle="#00a86b";ctx.beginPath();for(let i=0;i<6;i++){let a=(Math.PI/3)*i;if(i===0)ctx.moveTo(player.x+Math.cos(a)*player.radius*1.1,player.y+Math.sin(a)*player.radius*1.1);else ctx.lineTo(player.x+Math.cos(a)*player.radius*1.1,player.y+Math.sin(a)*player.radius*1.1);}ctx.closePath();ctx.fill();ctx.strokeStyle="#80ffaa";ctx.lineWidth=2;ctx.stroke();}
                else if(selectedColor==="diamond"){ctx.shadowBlur=12;ctx.shadowColor="#00e5ff";ctx.fillStyle="#4aa3df";ctx.beginPath();for(let i=0;i<8;i++){let a=(Math.PI/4)*i;if(i===0)ctx.moveTo(player.x+Math.cos(a)*player.radius*1.1,player.y+Math.sin(a)*player.radius*1.1);else ctx.lineTo(player.x+Math.cos(a)*player.radius*1.1,player.y+Math.sin(a)*player.radius*1.1);}ctx.closePath();ctx.fill();ctx.strokeStyle="#ffffff";ctx.lineWidth=2;ctx.stroke();}
                else{ctx.fillStyle="#111";ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();}
            }else{
                if(selectedColor==="rgb"){ctx.fillStyle=`hsl(${rgbHue},100%,55%)`;ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();}
                else if(selectedColor==="bosshc"){let pulse=10+Math.sin(Date.now()*0.02)*6;ctx.shadowBlur=pulse;ctx.shadowColor="#ff0000";let g=ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,player.radius);g.addColorStop(0,"#ff3333");g.addColorStop(0.3,"#440000");g.addColorStop(1,"#150000");ctx.fillStyle=g;ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#ff1a1a";ctx.lineWidth=2.5;ctx.stroke();bosshcVisualSquares.forEach(sq=>{ctx.save();ctx.globalAlpha=sq.alpha;ctx.fillStyle="#ff3333";ctx.shadowBlur=4;ctx.shadowColor="#ff0000";ctx.fillRect(player.x+sq.relX,player.y+sq.relY,sq.size,sq.size);ctx.restore();});}
                else if(selectedColor==="gold"){let p=5+Math.sin(Date.now()*0.01)*3;ctx.shadowBlur=p;ctx.shadowColor="#ffd700";let g=ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,player.radius);g.addColorStop(0,"#ffe680");g.addColorStop(1,"#d4af37");ctx.fillStyle=g;ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();}
                else if(selectedColor==="emerald"){let p=5+Math.sin(Date.now()*0.008)*3;ctx.shadowBlur=p;ctx.shadowColor="#00ff7f";let g=ctx.createRadialGradient(player.x,player.y,2,player.x,player.y,player.radius);g.addColorStop(0,"#80ffaa");g.addColorStop(1,"#00a86b");ctx.fillStyle=g;ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();}
                else if(selectedColor==="diamond"){let p=6+Math.sin(Date.now()*0.015)*4;ctx.shadowBlur=p;ctx.shadowColor="#00e5ff";let g=ctx.createRadialGradient(player.x,player.y,1,player.x,player.y,player.radius);g.addColorStop(0,"#ffffff");g.addColorStop(0.3,"#ccffff");g.addColorStop(1,"#4aa3df");ctx.fillStyle=g;ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();}
                else{ctx.fillStyle=player.color;ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();}}
            ctx.restore();
            ctx.save();if(currentDifficulty==="hardcore"){ctx.shadowBlur=8+Math.sin(Date.now()*0.02)*5;ctx.shadowColor="#ff0000";}ctx.fillStyle=npc.color;ctx.beginPath();ctx.arc(npc.x,npc.y,npc.radius,0,Math.PI*2);ctx.fill();if(npc.isHeavy){ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();}ctx.restore();
            ctx.restore();requestAnimationFrame(update);}
        loadSavedData();requestAnimationFrame(update);
    </script>
</body>
